<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Edit Job' : 'Add New Job'}">Job Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-md-11">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${isEdit ? 'Edit Job Details' : 'Add New Job'}">Job Form</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{${actionUrl}}" method="post">
                        <!-- Hidden ID for update -->
                        <input type="hidden" name="id" th:value="${job?.id}">

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Job Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title"
                                   th:value="${job?.title}" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description <span
                                    class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" name="description" rows="3" required
                                      th:text="${job?.description}"></textarea>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location"
                                   th:value="${job?.location}">
                        </div>

                        <div class="row">
                            <!-- Salary Min -->
                            <div class="col-md-6 mb-3">
                                <label for="salaryMin" class="form-label">Min Salary</label>
                                <input type="number" step="0.01" class="form-control" id="salaryMin" name="salaryMin"
                                       th:value="${job?.salaryMin}">
                            </div>
                            <!-- Salary Max -->
                            <div class="col-md-6 mb-3">
                                <label for="salaryMax" class="form-label">Max Salary</label>
                                <input type="number" step="0.01" class="form-control" id="salaryMax" name="salaryMax"
                                       th:value="${job?.salaryMax}">
                            </div>
                        </div>

                        <!-- Department ID (Vẫn giữ lại vì đây là trường bắt buộc có @NotNull) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="departmentId" class="form-label">Department <span
                                        class="text-danger">*</span></label>
                                <select class="form-select form-select-sm" aria-label=".form-select-sm example"
                                        id="departmentId">
                                    <option selected value="">Open this select menu</option>
                                    <option th:each="dept: ${departments}" th:value="${dept.id}"
                                            th:text="${dept.departmentName}"></option>

                                </select>
                                <small class="text-muted">Enter a valid Department ID</small>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/jobs}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success"
                                    th:text="${isEdit ? 'Update Job' : 'Save Job'}">Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

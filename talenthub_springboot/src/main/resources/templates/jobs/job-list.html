<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<div class="container-fluid mt-5 px-5">
    <div class="d-flex justify-content-between mb-3">
        <h3 class="mb-4">Job List</h3>
        <a th:href="@{/jobs/detail}" type="button" class="btn btn-primary">Create Job Posting</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Location</th>
                <th>Salary Min</th>
                <th>Salary Max</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job, iterStat : ${jobs}">
                <td th:text="${iterStat.index+1}"></td>
                <td th:text="${job.title}"></td>
                <td th:text="${job.location}"></td>
                <td th:text="${job.salaryMin}"></td>
                <td th:text="${job.salaryMax}"></td>
                <td th:text="${job.status}"></td>
                <td>
                    <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <a th:href="@{/jobs/delete(id=${job.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this job?');">Delete</a>
                    <a th:href="@{jobs/publishion/{id}(id=${job.id})}" class="btn btn-sm btn-info text-light"
                       onclick="return confirm('Are you sure you want to publish this job?');"
                        >Publish</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container-fluid px-3">
    <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="card border-0 shadow-sm" style="width: min(100%, 640px); min-height: 560px;">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-3">Login Form</h2>
                <hr class="mt-0 mb-3">
                <p class="card-text text-muted mb-4">Welcome back. Sign in to continue to your account.</p>

                <form th:object="${loginRequest}" method="post" th:action="@{/auths/login}">
                    <div class="row g-3">
                        <div class="col-12">
                            <input id="email" type="email" class="form-control" th:field="*{email}"
                                   placeholder="admin@example.com" autocomplete="email" autofocus>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="col-12">
                            <input id="password" type="password" class="form-control" th:field="*{password}"
                                   placeholder="Your Password" autocomplete="current-password">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="true" id="rememberMe" name="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="small">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4">Login</button>

                    <p class="text-center text-muted small mt-3 mb-0">
                        Don't have an account?
                        <a th:href="@{/auths/register}" href="/auths/register">Register now</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

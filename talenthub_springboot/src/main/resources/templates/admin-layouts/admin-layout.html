<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <link th:href="@{/css/admin.css}" href="/css/admin.css" rel="stylesheet">
</head>
<body class="admin-page">
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <header th:replace="~{admin-layouts/admin-header :: header}"></header>
        </div>
    </div>
    <div class="row">
        <div class="col-md-2 px-4">
            <div th:replace="~{admin-layouts/admin-sidebar :: sidebar}"></div>
        </div>
        <div class="col-md-10">
            <main layout:fragment="content">
                <p>Nội dung mặc định nếu trang con không cung cấp.</p>
            </main>
        </div>

    </div>
    <div class="row">
        <div class="col-md-12">
            <footer th:replace="~{admin-layouts/admin-footer :: footer}"></footer>
        </div>
    </div>

</div>
</body>
</html>

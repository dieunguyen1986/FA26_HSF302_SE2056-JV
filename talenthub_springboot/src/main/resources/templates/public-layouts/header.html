<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header(active)" class="bg-white text-dark shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold"
               th:href="@{/public}">
                <span class="border border-primary rounded px-2 py-1 text-primary">TH</span>
                <span class="text-dark">TalentHub</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#publicNavbar" aria-controls="publicNavbar"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="publicNavbar" class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto mb-3 mb-lg-0 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link text-dark"
                           th:classappend="${active == 'home'} ? ' active fw-bold'"
                           th:href="@{/public}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark"
                           th:classappend="${active == 'jobs'} ? ' active fw-bold'"
                           th:href="@{/public/jobs}">Find jobs</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAuthority('ROLE_RECRUITER')">
                        <a class="nav-link text-dark" th:href="@{/jobs}">Employer dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="#about">About us</a>
                    </li>
                </ul>

                <div sec:authorize="isAnonymous()" class="d-flex flex-column flex-lg-row gap-2">
                    <a class="btn btn-outline-primary btn-sm px-3" th:href="@{/auths/login}">Log in</a>
                    <a class="btn btn-primary btn-sm px-3" th:href="@{/auths/register}">Register</a>
                </div>

                <div sec:authorize="isAuthenticated()"
                     class="d-flex flex-column flex-lg-row align-items-lg-center gap-2">
                    <span class="small text-secondary" sec:authentication="name">user@example.com</span>
                    <form th:action="@{/auths/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-primary btn-sm px-3">Log out</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>

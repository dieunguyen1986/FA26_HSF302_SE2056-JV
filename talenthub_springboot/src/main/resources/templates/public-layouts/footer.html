<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="bg-white text-dark border-top pt-3">
    <div class="container">
        <div class="row g-3 align-items-center pb-3">
            <div class="col-lg-4">
                <a class="d-inline-flex align-items-center gap-2 text-dark text-decoration-none fw-bold fs-5 mb-1"
                   th:href="@{/public}">
                    <span class="border border-primary rounded px-2 py-1 text-primary fs-6">TH</span>
                    <span class="text-dark">TalentHub</span>
                </a>
                <p class="text-secondary small mb-0">
                    Kết nối ứng viên với cơ hội nghề nghiệp phù hợp.
                </p>
            </div>

            <div class="col-6 col-lg-2">
                <h6 class="text-uppercase fw-bold small mb-2">Explore</h6>
                <ul class="list-unstyled small mb-0">
                    <li class="mb-1"><a class="link-dark text-decoration-none" th:href="@{/public}">Home</a></li>
                    <li class="mb-1"><a class="link-dark text-decoration-none" th:href="@{/public/jobs}">Find jobs</a></li>
                    <li><a class="link-dark text-decoration-none" th:href="@{/auths/register}">Join TalentHub</a></li>
                </ul>
            </div>

            <div class="col-6 col-lg-2">
                <h6 class="text-uppercase fw-bold small mb-2">Support</h6>
                <ul class="list-unstyled small mb-0">
                    <li class="mb-1"><a class="link-dark text-decoration-none" href="#about">About us</a></li>
                    <li class="mb-1"><a class="link-dark text-decoration-none" href="#newsletter">Newsletter</a></li>
                    <li><a class="link-dark text-decoration-none" href="#contact">Contact</a></li>
                </ul>
            </div>

            <div id="newsletter" class="col-lg-4">
                <h6 class="text-uppercase fw-bold small mb-2">Stay updated</h6>
                <form class="input-group input-group-sm" onsubmit="return false">
                    <input type="email" class="form-control" placeholder="Email của bạn" aria-label="Email của bạn">
                    <button class="btn btn-primary" type="submit">Subscribe</button>
                </form>
            </div>
        </div>

        <hr class="my-0">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-2 py-2 small text-secondary">
            <span>&copy; 2026 TalentHub. All rights reserved.</span>
            <span>Built for better career connections.</span>
        </div>
    </div>
</footer>
</body>
</html>

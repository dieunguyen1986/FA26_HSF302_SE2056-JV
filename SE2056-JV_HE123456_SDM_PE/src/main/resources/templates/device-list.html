<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Device List</title>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}" crossorigin="anonymous">
    <script th:src="@{/bootstrap.min.js}" crossorigin="anonymous"></script>

<!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"-->
<!--          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">-->
</head>
<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-md-12">
                <h3>SMART DEVICE MANAGEMENT</h3>
                <hr>
                <form class="row g-3 align-items-center mt-2">
                    <div class="col-auto">
                        <label for="deviceName" class="form-label">Device name: </label>
                    </div>
                    <div class="col-md-7">
                        <input type="text" class="form-control" id="deviceName" placeholder="Enter device name...">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-info">Add new</button>
                    </div>
                </form>

                <h4 class="mt-5">List Devices</h4>

                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th scope="col">Code</th>
                        <th scope="col">Device Name</th>
                        <th scope="col">Category</th>
                        <th scope="col">Price ($)</th>
                        <th scope="col">Installation Date</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>

                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="device: ${devices}">
                        <td th:text="${device.deviceCode}">Mark</td>
                        <td th:text="${device.deviceName}">Mark</td>
                        <td th:text="${device.categoryName}">Mark</td>
                        <td th:text="${device.price}">Mark</td>
                        <td th:text="${device.installationDate}">Mark</td>
                        <td th:text="${device.status}">Mark</td>
                        <td>
                            <a type="button" href="#">View</a> |
                            <a type="button" href="#" data-bs-toggle="modal" th:data-bs-target="'#deleteModal-' + ${device.id}">Delete</a>
                        </td>

                        <div class="modal fade" th:id="'deleteModal-' + ${device.id}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="exampleModalLabel">Confirmation</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        Are you sure you want to delete "<span th:text="${device.deviceName}">Mark</span>"?
                                    </div>
                                    <div class="modal-footer">
                                        <a type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:href="@{/devides/{id}(id=${device.id})}" >Yes</a>
                                        <button type="button" class="btn btn-primary">No</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </tr>

                    </tbody>
                </table>

            </div>
        </div>

    </div>

</body>
</html>
